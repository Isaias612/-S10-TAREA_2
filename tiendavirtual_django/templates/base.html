<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTech</title><style>
:root{--p:#2563eb;--d:#0f172a;}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1e293b;font-family:Arial,sans-serif}
header{background:var(--d);color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
header strong{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:white;text-decoration:none;padding:8px 10px;border-radius:7px}nav a:hover{background:#ffffff22}
main{max-width:1100px;margin:30px auto;padding:0 18px}.hero{padding:28px;border-radius:16px;background:linear-gradient(120deg,var(--p),var(--d));color:white}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin:20px 0}.card,.formbox{background:white;padding:20px;border-radius:13px;border:1px solid #e2e8f0}
.num{font-size:30px;font-weight:bold;color:var(--p)}.btn{display:inline-block;background:var(--p);color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}
.danger{background:#dc2626}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:5px 0 12px}label{font-weight:bold}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#e8eef5}.tablewrap{overflow-x:auto}
.alert{background:#dcfce7;color:#166534;padding:12px;border-radius:8px;margin-bottom:12px}.muted{color:#64748b}
</style></head><body><header><div><strong>NovaTech</strong><div>Tecnología, ventas e inventario</div></div><nav>
{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Inicio</a><a href="{% url 'producto_lista' %}">Productos</a><a href="{% url 'categoria_lista' %}">Categorías</a><a href="{% url 'marca_lista' %}">Marcas</a><a href="{% url 'cliente_lista' %}">Clientes</a><a href="{% url 'mi_perfil' %}">Mi perfil</a><a href="{% url 'salir' %}">Salir</a>
{% else %}<a href="{% url 'login' %}">Ingresar</a><a href="{% url 'registro' %}">Registro</a>{% endif %}</nav></header><main>
{% if messages %}{% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}
</main></body></html>
